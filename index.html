<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fallacy & Reflections | RPJ Digital Collection</title>

    <meta
      name="description"
      content="An immersive digital exhibition exploring duality, memory, reflection, and emotional space."
    />

    <meta property="og:title" content="Fallacy & Reflections" />
    <meta
      property="og:description"
      content="An immersive digital exhibition exploring duality, memory, reflection, and emotional space."
    />
    <meta property="og:image" content="/social-preview.jpg" />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://fallacy-and-reflections.netlify.app/"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fallacy & Reflections" />
    <meta
      name="twitter:description"
      content="An immersive digital exhibition exploring duality, memory, reflection, and emotional space."
    />
    <meta name="twitter:image" content="/social-preview.jpg" />

    <!-- Elegant artistic fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Nunito+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles/global.css" />
  </head>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: "Nunito Sans", sans-serif;
      background: linear-gradient(-45deg, #0b0b0b, #101010, #141414, #0f0f0f);
      background-size: 400% 400%;
      animation: gradientShift 28s ease infinite;
      color: #f5f5f5;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* ✅ Keep dark background visible, no white overlay */
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.4); /* transparent dark tint */
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      text-align: center;
      overflow: hidden;
    }

    h1 {
      position: relative;
      z-index: 1;
      font-family: "Cormorant Garamond", serif;
      font-size: 2.8rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 500;
      color: #f5f5f5;
      opacity: 0;
      animation: fadeIn 2s ease forwards 0.5s;
    }

    h1::after {
      content: "";
      display: block;
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, #d4af37, #f5e7c6);
      margin: 12px auto;
      border-radius: 2px;
      opacity: 0;
      animation: fadeIn 2s ease forwards 1.2s;
    }

    .artist-signature {
      position: relative;
      z-index: 1;
      display: block;
      margin: 12px auto 0;
      width: 180px;
      opacity: 0.9;
      pointer-events: none;
      transform: rotate(-2deg);
      filter: brightness(1.6) sepia(1) hue-rotate(10deg) saturate(5)
        drop-shadow(0 0 6px rgba(255, 215, 0, 0.6));
      animation: fadeInSignature 2.5s ease forwards;
    }

    @keyframes fadeInSignature {
      from {
        opacity: 0;
        transform: translateY(10px) rotate(-2deg);
      }
      to {
        opacity: 0.9;
        transform: translateY(0) rotate(-2deg);
      }
    }

    p {
      position: relative;
      z-index: 1;
      font-size: 1rem;
      opacity: 0;
      color: #ddd;
      animation: fadeIn 2.5s ease forwards 1.8s;
    }

    .exhibition-kicker {
      position: relative;
      z-index: 1;
      margin: 18px 0 4px;
      font-family: "Nunito Sans", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.48);
      opacity: 0;
      animation: fadeIn 2.5s ease forwards 1.7s;
    }

    .exhibition-title {
      position: relative;
      z-index: 1;
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-size: 1.45rem;
      font-style: italic;
      letter-spacing: 0.6px;
      color: rgba(245, 231, 198, 0.92);
      opacity: 0;
      animation: fadeIn 2.5s ease forwards 1.9s;
    }

    #rotating-line {
      position: relative;
      z-index: 1;
      margin-top: 10px;
      min-height: 28px;
      font-family: "Cormorant Garamond", serif;
      font-size: 1.1rem;
      font-style: italic;
      letter-spacing: 0.4px;
      color: rgba(255, 255, 255, 0.82);
      opacity: 0;
      animation: fadeIn 2.5s ease forwards 2s;
      transition: opacity 0.8s ease;
    }

    #gallery-footer {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      font-size: 0.72rem;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.38);
      font-family: "Nunito Sans", sans-serif;
      text-align: center;
      white-space: nowrap;
    }

    #controls-toggle {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 10000;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(0, 0, 0, 0.46);
      color: rgba(255, 255, 255, 0.92);
      font-family: "Nunito Sans", sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      cursor: pointer;
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      transition:
        transform 0.25s ease,
        background 0.25s ease,
        opacity 0.25s ease;
    }

    #controls-toggle:hover {
      transform: scale(1.06);
      background: rgba(0, 0, 0, 0.62);
    }

    #controls-help {
      position: fixed;
      top: 78px;
      right: 22px;
      z-index: 9999;
      padding: 14px 18px;
      min-width: 245px;
      max-width: 280px;
      background: rgba(0, 0, 0, 0.62);
      color: rgba(255, 255, 255, 0.92);
      border-radius: 14px;
      font-family: "Nunito Sans", sans-serif;
      font-size: 0.92rem;
      line-height: 1.42;
      text-align: left;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.32);
      pointer-events: none;
      opacity: 0;
      transform: translateY(-8px);
      visibility: hidden;
      transition:
        opacity 0.28s ease,
        transform 0.28s ease,
        visibility 0.28s ease;
    }

    #controls-help.is-open {
      display: block !important;
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.1rem;
        line-height: 1.1;
        padding: 0 20px;
      }

      .artist-signature {
        width: 140px;
      }

      p {
        padding: 0 28px;
        font-size: 0.95rem;
      }

      .exhibition-kicker {
        margin-top: 16px;
        font-size: 0.64rem;
        letter-spacing: 1.8px;
      }

      .exhibition-title {
        padding: 0 24px;
        font-size: 1.25rem;
      }

      #rotating-line {
        padding: 0 30px;
        font-size: 1rem;
      }

      #loading-bar {
        width: 220px;
      }

      #start-button {
        margin-top: 28px;
        padding: 11px 26px;
      }

      #gallery-footer {
        bottom: 42px;
        font-size: 0.62rem;
        letter-spacing: 1.2px;
      }

      #controls-toggle {
        top: 18px;
        right: 18px;
        width: 44px;
        height: 44px;
        font-size: 1.2rem;
      }

      #controls-help {
        top: 72px;
        right: 18px;
        bottom: auto;
        left: auto;
        transform: translateY(-8px);
        width: min(280px, calc(100% - 36px));
        max-width: 280px;
        min-width: 0;
        font-size: 0.88rem;
        line-height: 1.42;
        text-align: left;
      }

      #controls-help.is-open {
        display: block !important;
        transform: translateY(0);
      }
    }

    #loading-bar {
      position: relative;
      z-index: 1;
      width: 280px;
      height: 8px;
      background-color: rgba(255, 255, 255, 0.15);
      margin-top: 24px;
      border-radius: 5px;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 2.5s ease forwards 2.2s;
    }

    #loading-progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f1e7b6, #d4af37, #f1e7b6);
      background-size: 200% 200%;
      animation: shimmer 3s linear infinite;
    }

    @keyframes shimmer {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 200% 50%;
      }
    }

    #start-button {
      position: relative;
      z-index: 1;
      margin-top: 35px;
      padding: 12px 32px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #f5f5f5;
      border-radius: 40px;
      font-family: "Nunito Sans", sans-serif;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 1px;
      cursor: pointer;
      opacity: 0;
      animation: fadeIn 3s ease forwards 2.8s;
      transition: all 0.4s ease;
    }

    #start-button:hover {
      background: rgba(255, 255, 255, 0.8);
      color: #000;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

  <body>
    <div id="loading-screen">
      <h1>The Virtual Art Gallery</h1>
      <img
        src="./assets/images/signature.png"
        alt="Rajini Preetha John Signature"
        class="artist-signature"
      />

      <div class="exhibition-kicker">Current Exhibition</div>
      <p class="exhibition-title">Fallacy &amp; Reflections — Summer 2026</p>

      <div id="rotating-line">Where silence becomes color.</div>

      <div id="loading-bar">
        <div id="loading-progress"></div>
      </div>
      <button id="start-button">Enter Experience</button>

      <div id="gallery-footer">RPJ Digital Collection • 2026</div>
    </div>

    <button id="controls-toggle" type="button" aria-label="Show controls">
      i
    </button>
    <div
      id="controls-help"
      data-rpj-controls-help="true"
      aria-hidden="true"
    ></div>

    <div id="artwork-info">
      <h3 id="artwork-title">Artwork Title</h3>
      <p id="artwork-artist">By RPJ</p>
      <p id="artwork-description">
        Description of the artwork will appear here when you approach a piece.
      </p>
    </div>

    <!-- Duplicate signature image removed -->

    <script type="module" src="src/main.js"></script>
    <script>
      // Simulate loading
      window.addEventListener("DOMContentLoaded", () => {
        const progressBar = document.getElementById("loading-progress");
        const startButton = document.getElementById("start-button");
        const loadingScreen = document.getElementById("loading-screen");

        const rotatingLine = document.getElementById("rotating-line");
        const controlsHelp = document.getElementById("controls-help");
        const controlsToggle = document.getElementById("controls-toggle");

        const isMobile =
          /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(
            navigator.userAgent,
          ) ||
          navigator.maxTouchPoints > 0 ||
          window.matchMedia("(pointer: coarse)").matches;

        if (isMobile) {
          controlsHelp.innerHTML = `
            Touch & Drag to look around<br>
            Use glowing orb to move<br>
            Approach artwork for details<br>
            Release finger to stop
          `;
        } else {
          controlsHelp.innerHTML = `
            Click to start<br>
            Move: W, A, S, D or Arrow Keys<br>
            Look: Mouse<br>
            Press ESC to exit movement
          `;
        }

        let controlsHelpTimer;

        function openControlsHelp() {
          controlsHelp.classList.add("is-open");
          controlsHelp.setAttribute("aria-hidden", "false");
          controlsToggle.setAttribute("aria-label", "Hide controls");
          clearTimeout(controlsHelpTimer);
          controlsHelpTimer = setTimeout(closeControlsHelp, 5000);
        }

        function closeControlsHelp() {
          controlsHelp.classList.remove("is-open");
          controlsHelp.setAttribute("aria-hidden", "true");
          controlsToggle.setAttribute("aria-label", "Show controls");
          clearTimeout(controlsHelpTimer);
        }

        function toggleControlsHelp(event) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation?.();

          if (controlsHelp.classList.contains("is-open")) {
            closeControlsHelp();
          } else {
            openControlsHelp();
          }
        }

        function blockControlsClick(event) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation?.();
        }

        controlsToggle.addEventListener(
          "pointerdown",
          toggleControlsHelp,
          true,
        );
        controlsToggle.addEventListener("mousedown", blockControlsClick, true);
        controlsToggle.addEventListener("click", blockControlsClick, true);
        controlsToggle.addEventListener("touchend", blockControlsClick, true);

        const poeticLines = [
          "Where silence becomes color.",
          "A quiet room for digital dreams.",
          "Wander slowly. Let the work find you.",
          "Art, atmosphere, and memory in motion.",
          "Step inside a world of light and stillness.",
        ];

        let currentLine = 0;

        setInterval(() => {
          rotatingLine.style.opacity = 0;

          setTimeout(() => {
            currentLine = (currentLine + 1) % poeticLines.length;
            rotatingLine.textContent = poeticLines[currentLine];
            rotatingLine.style.opacity = 1;
          }, 700);
        }, 5000);

        let progress = 0;
        const interval = setInterval(() => {
          progress += Math.random() * 10;
          if (progress >= 100) {
            progress = 100;
            clearInterval(interval);
            startButton.style.display = "block";
          }
          progressBar.style.width = `${progress}%`;
        }, 200);

        startButton.addEventListener("click", () => {
          loadingScreen.style.transition = "opacity 1s ease";
          loadingScreen.style.opacity = 0;
          setTimeout(() => loadingScreen.remove(), 1000);
        });
      });
    </script>
  </body>
</html>
